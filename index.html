<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accenture Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Login Form -->
    <div class="container" id="login-container">
        <header>
            <h1>Accenture Todo App</h1>
        </header>
        <main>
            <h2 class="login-title">Login</h2>
            <div id="login-error" class="login-error" style="display:none;">Invalid username or password.</div>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn">Login</button>
            </form>
        </main>
    </div>

    <!-- Todo App -->
    <div class="container" id="todo-container" style="display:none;">
        <header>
            <h1>Accenture Todo App</h1>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </header>
        <main>
            <div class="todo-input">
                <input type="text" id="new-todo" placeholder="Add a new task...">
                <button id="add-btn">Add</button>
            </div>
            <ul id="todo-list"></ul>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
